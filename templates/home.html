{% extends "base.html" %}

{% block content %}

<h1>Chat</h1>

<div id="chat-box" class="chat-box"></div>

<div class="chat-input">
    <textarea id="msg" placeholder="Napisz wiadomość..."></textarea>
    <button onclick="sendMsg()">Wyślij</button>
</div>

<div class="context-box">
    <label>Kontekst (dodawany do promptu)</label>
    <textarea id="contextBox" placeholder="Wpisz dodatkowy kontekst lub kliknij plik z lewej..."></textarea>
</div>

<style>

.folder-header {
    cursor: pointer;
    user-select: none;
    padding: 2px 4px;
    border-radius: 4px;
}

.folder-header:hover {
    background: #2a2a2a;
}

.git-file {
    cursor: pointer;
}

.git-func {
    cursor: pointer;
    color: #9ad;
}

</style>
<script src="/static/js/core.js"></script>
<script src="/static/js/loaders.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/git.js"></script>
{% endblock %}
