{% extends "base.html" %}

{% block content %}

<div class="chat-header">
    <h1>Chat</h1>
    <button class="context-btn" onclick="toggleContext()">kontekst</button>
</div>

<div id="chat-box" class="chat-box"></div>

<div class="chat-input">
    <textarea id="msg" placeholder="Napisz wiadomość..."></textarea>
    <button onclick="sendMsg()">Wyślij</button>
</div>

<div class="context-box">
    <label>Kontekst (dodawany do promptu)</label>
    <textarea id="contextBox" placeholder="Wpisz dodatkowy kontekst lub kliknij plik z lewej..."></textarea>
</div>

<!-- POPUP -->
<div id="contextModal" class="context-modal hidden">

    <div class="context-window">

        <div class="context-topbar">
            <span>Debug kontekstu promptu</span>
            <button onclick="toggleContext()">✕</button>
        </div>

        <pre id="contextContent"></pre>

    </div>

</div>

<style>

.context-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.context-window {
    width: 80%;
    height: 80%;
    background: #1e1e1e;
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
}

.context-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    color: white;
}

#contextContent {
    flex: 1;
    overflow: auto;
    background: #111;
    color: #ddd;
    padding: 12px;
    border-radius: 6px;
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 13px;
}

.hidden {
    display: none;
}

</style>


<script src="/static/js/core.js"></script>
<script src="/static/js/loaders.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/git.js"></script>

{% endblock %}
