{% extends "base.html" %}

{% block content %}

<div class="chat-header">
    <h1>Chat</h1>

    <div class="context-button-wrap">
        <span id="promptTokenEstimate" class="prompt-token-estimate">
            tokeny: —
        </span>
        <button class="context-btn" onclick="toggleContext()">
            kontekst
        </button>

    </div>
</div>

<div id="chat-box" class="chat-box"></div>

<div class="chat-input">
    <textarea id="msg" placeholder="Napisz wiadomość..."></textarea>
    <button onclick="sendMsg()">Wyślij</button>
</div>

<div class="context-box">
    <label>Kontekst (dodawany do promptu)</label>

    <textarea
        id="contextBox"
        placeholder="Wpisz dodatkowy kontekst lub kliknij plik z lewej..."
    ></textarea>
</div>


<!-- ========================= -->
<!-- POPUP -->
<!-- ========================= -->
<div id="contextModal" class="context-modal hidden">

    <div class="context-window">

        <div class="context-topbar">

            <div>
                <div>
                    Finalny prompt wysyłany do modelu
                </div>
                <div id="promptMeta" class="prompt-meta"></div>
            </div>

            <button onclick="closeContextModal()">
                ✕
            </button>

        </div>

        <div class="prompt-editor-grid">

            <section class="prompt-section prompt-section-system">
                <label>SYSTEM</label>
                <textarea
                    id="promptSystem"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-summary">
                <label>SUMMARY</label>
                <textarea
                    id="promptSummary"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-context">
                <label>CONTEXT</label>
                <textarea
                    id="promptContext"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-history">
                <div class="prompt-section-header">
                    <label>HISTORY</label>
                    <button
                        type="button"
                        onclick="addHistoryEditor('user', '')"
                    >
                        + user
                    </button>
                    <button
                        type="button"
                        onclick="addHistoryEditor('assistant', '')"
                    >
                        + assistant
                    </button>
                </div>

                <div
                    id="promptHistory"
                    class="prompt-history-list"
                ></div>
            </section>

            <section class="prompt-section prompt-section-user">
                <label>USER MESSAGE</label>
                <textarea
                    id="promptUser"
                    spellcheck="false"
                ></textarea>
            </section>

        </div>

        <div class="prompt-actions">
            <button
                type="button"
                onclick="closeContextModal()"
            >
                Anuluj
            </button>

            <button
                type="button"
                onclick="sendMsg()"
            >
                Wyślij prompt
            </button>
        </div>

    </div>

</div>


<style>

.context-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 9999;
}

.context-window {
    width: 94%;
    height: 92%;

    background: #1e1e1e;

    border-radius: 10px;

    padding: 12px;

    display: flex;
    flex-direction: column;

    box-sizing: border-box;
}

.context-topbar {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

    color: white;
}

.context-topbar button,
.prompt-actions button,
.prompt-section-header button,
.prompt-history-top button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 5px 9px;
    cursor: pointer;
}

.context-topbar button:hover,
.prompt-actions button:hover,
.prompt-section-header button:hover,
.prompt-history-top button:hover {
    background: #444;
}

.prompt-meta {
    margin-top: 4px;
    font-size: 12px;
    color: #aaa;
}

.prompt-editor-grid {
    flex: 1;
    min-height: 0;

    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 0.65fr 1fr 0.65fr;
    gap: 10px;
}

.prompt-section {
    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #181818;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px;

    box-sizing: border-box;
}

.prompt-section label,
.prompt-section-header label {
    margin-bottom: 6px;
    color: #bbb;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.05em;
}

.prompt-section textarea,
.prompt-history-content {
    flex: 1;
    min-height: 0;

    width: 100%;

    resize: none;
    overflow: auto;

    background: #111;
    color: #ddd;

    border: 1px solid #333;
    border-radius: 6px;

    padding: 10px;

    white-space: pre-wrap;

    font-family: monospace;
    font-size: 13px;
    line-height: 1.4;

    outline: none;

    box-sizing: border-box;
}

.prompt-section-system {
    grid-column: 1;
    grid-row: 1;
}

.prompt-section-summary {
    grid-column: 2;
    grid-row: 1;
}

.prompt-section-context {
    grid-column: 1;
    grid-row: 2;
}

.prompt-section-history {
    grid-column: 2;
    grid-row: 2 / span 2;
}

.prompt-section-user {
    grid-column: 1;
    grid-row: 3;
}

.prompt-section-header {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 6px;
}

.prompt-section-header label {
    margin-right: auto;
    margin-bottom: 0;
}

.prompt-history-list {
    flex: 1;
    min-height: 0;

    overflow: auto;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.prompt-history-item {
    min-height: 180px;

    display: flex;
    flex-direction: column;

    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px;

    background: #151515;
}

.prompt-history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 6px;
}

.prompt-history-role {
    background: #111;
    color: #ddd;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 4px 8px;
}

.prompt-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;

    margin-top: 10px;
}

.hidden {
    display: none;
}

</style>


<script src="/static/js/core.js"></script>
<script src="/static/js/loaders.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/git.js"></script>

{% endblock %}
