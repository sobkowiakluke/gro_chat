{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='prompt_modal.css') }}">

<div class="chat-header">
    <h1>Chat</h1>

    <div class="context-button-wrap">
        <span id="promptTokenEstimate" class="prompt-token-estimate">
            tokeny: —
        </span>
        <button class="context-btn" onclick="toggleContext()">
            kontekst
        </button>

    </div>
</div>

<div id="chat-box" class="chat-box"></div>

<div class="chat-input">
    <textarea id="msg" placeholder="Napisz wiadomość..."></textarea>
    <button onclick="sendMsg()">Wyślij</button>
</div>

<div class="context-box">
    <label>Kontekst (dodawany do promptu)</label>

    <textarea
        id="contextBox"
        placeholder="Wpisz dodatkowy kontekst lub kliknij plik z lewej..."
    ></textarea>
</div>


<!-- ========================= -->
<!-- POPUP -->
<!-- ========================= -->
<div id="contextModal" class="context-modal hidden">

    <div class="context-window">

        <div class="context-topbar">

            <div>
                <div>
                    Finalny prompt wysyłany do modelu
                </div>
                <div id="promptMeta" class="prompt-meta"></div>
            </div>

            <button onclick="closeContextModal()">
                ✕
            </button>

        </div>

        <div class="prompt-editor-grid">

            <section class="prompt-section prompt-section-system">
                <label>SYSTEM</label>
                <textarea
                    id="promptSystem"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-summary">
                <label>SUMMARY</label>
                <textarea
                    id="promptSummary"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-context">
                <label>CONTEXT</label>
                <textarea
                    id="promptContext"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-history">
                <div class="prompt-section-header">
                    <label>HISTORY</label>
                    <button
                        type="button"
                        onclick="addHistoryEditor('user', '')"
                    >
                        + user
                    </button>
                    <button
                        type="button"
                        onclick="addHistoryEditor('assistant', '')"
                    >
                        + assistant
                    </button>
                </div>

                <div
                    id="promptHistory"
                    class="prompt-history-list"
                ></div>
            </section>

            <section class="prompt-section prompt-section-user">
                <label>USER MESSAGE</label>
                <textarea
                    id="promptUser"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-facts">
                <label>FACTS</label>
                <textarea
                    id="promptFacts"
                    spellcheck="false"
                ></textarea>
            </section>

            <section class="prompt-section prompt-section-decisions">
                <label>DECISIONS</label>
                <textarea
                    id="promptDecisions"
                    spellcheck="false"
                ></textarea>
            </section>

        </div>

        <div class="prompt-actions prompt-memory-actions">
            <button type="button" onclick="savePromptMemoryFromPopup()">
                Zapisz pamięć promptu
            </button>

            <button type="button" onclick="resetPromptMemory()">
                Reset pamięci promptu
            </button>
        </div>

        <div class="prompt-actions">
            <button
                type="button"
                onclick="compressHistoryToSummary()"
            >
                History → Summary
            </button>

            <button
                type="button"
                onclick="closeContextModal()"
            >
                Anuluj
            </button>

            <button
                type="button"
                onclick="sendEditedPrompt()"
            >
                Wyślij prompt
            </button>
        </div>

    </div>

</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/loaders.js"></script>
<script src="/static/js/chat_state.js"></script>
<script src="/static/js/chat_prompt.js"></script>
<script src="/static/js/chat_flow.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/git.js"></script>

{% endblock %}
